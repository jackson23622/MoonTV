name: Update Sources

# 每天北京时间 03:17 自动检测资源站并换源；推送后 Cloudflare Pages 自动重新部署
on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sources
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check sources and rewrite config.json
        run: node scripts/update-sources.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json .github/source-report.md
          if git diff --cached --quiet; then
            echo "无变化"
            exit 0
          fi
          if git diff --cached --quiet -- config.json; then
            git commit -m "chore: 更新资源站检测报告 [skip ci]"
          else
            git commit -m "chore: 自动换源 $(TZ=Asia/Shanghai date +%F)"
          fi
          git pull --rebase origin ${{ github.ref_name }}
          git push
